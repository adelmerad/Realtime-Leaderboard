# Render Blueprint — https://render.com/docs/blueprint-spec
# The database is hosted on Neon (free PostgreSQL); paste its connection strings when Render asks.
services:
  - type: web
    name: realtime-leaderboard
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Apply pending migrations on every deploy, then start Next.js on Render's $PORT
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
